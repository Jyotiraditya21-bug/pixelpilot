[project]
name = "pixelpilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["playwright","pydantic","pydantic-settings","typer","httpx","pillow","jinja2","fastapi","uvicorn","opentelemetry-api","opentelemetry-sdk"]
[project.scripts]
pixelpilot = "pixelpilot.cli:app"
[dependency-groups]
dev = ["pytest","pytest-asyncio","ruff","mypy"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/pixelpilot"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["vlm: needs real Ollama"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
src = ["src","tests"]
[tool.ruff.lint]
select = ["E","F","I","UP","B"]
[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
